<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-title" content="멍화분">
  <meta name="theme-color" content="#FFF7EE">
  <title>멍화분</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <!-- 시작 화면 -->
    <section id="screen-home" class="screen active">
      <h1>멍화분</h1>
      <p class="lead">내려놓은 만큼 자라는 나의 작은 정원</p>

      <div class="today">
        <div class="today-num" id="today-minutes">0</div>
        <div class="today-label">오늘 키운 시간(분)</div>
      </div>

      <svg id="plant-home" class="plant-home"></svg>

      <p class="label">목표 시간</p>
      <div class="goals" id="goals">
        <button data-min="1">1분</button>
        <button data-min="15">15분</button>
        <button data-min="30" class="selected">30분</button>
        <button data-min="60">60분</button>
        <button data-min="custom" id="chip-custom">직접 입력</button>
      </div>
      <div id="custom-row" class="custom-row hidden">
        <input id="custom-min" type="number" inputmode="numeric" min="1" max="300" placeholder="45">
        <span>분</span>
        <small>1~300분</small>
      </div>

      <button id="btn-start" class="primary">씨앗 심기</button>
      <button id="btn-history" class="link">기록 보기</button>
    </section>

    <!-- 진행 화면 -->
    <section id="screen-grow" class="screen">
      <p id="grow-status" class="status">폰을 화면이 바닥을 향하게 엎어주세요</p>
      <div class="stage" id="grow-stage">
        <svg id="plant" aria-label="식물"></svg>
      </div>
      <div id="timer" class="timer">00:00</div>
      <div class="bar"><div id="bar-fill"></div></div>
      <p id="grace" class="grace hidden"></p>

      <div id="sim" class="sim hidden">
        <p>이 기기에는 기울기 센서가 없어요 (테스트 모드)</p>
        <button id="btn-sim">엎어두기 / 들기 전환</button>
      </div>

      <button id="btn-giveup" class="link">그만두기</button>
    </section>

    <!-- 결과 화면 -->
    <section id="screen-result" class="screen">
      <h2 id="result-title"></h2>
      <div class="stage" id="result-stage">
        <svg id="plant-result"></svg>
        <div class="sparkles"><i>✦</i><i>✧</i><i>✦</i><i>✧</i><i>✦</i><i>✧</i></div>
      </div>
      <p id="result-text" class="lead"></p>
      <button id="btn-again" class="primary">다시 키우기</button>
      <button id="btn-home" class="link">처음으로</button>
    </section>

    <!-- 기록 화면 -->
    <section id="screen-history" class="screen">
      <h2>기록</h2>
      <ul id="history-list" class="history"></ul>
      <button id="btn-back" class="primary">돌아가기</button>
      <button id="btn-reset" class="link danger">기록 모두 지우기</button>
    </section>
  </main>

  <!-- 홈 화면에 추가 안내 -->
  <div id="install" class="install hidden">
    <img src="icons/icon-192.png" alt="">
    <div class="install-text">
      <b>홈 화면에 추가하기</b>
      <span id="install-desc">앱처럼 바로 열 수 있어요</span>
    </div>
    <button id="btn-install" class="install-btn">추가</button>
    <button id="btn-install-close" class="install-close" aria-label="닫기">✕</button>
  </div>

  <div id="dim" class="dim hidden"></div>
  <div id="fx" class="fx"></div>

  <script src="plant.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
  <script src="install.js"></script>
</body>
</html>
